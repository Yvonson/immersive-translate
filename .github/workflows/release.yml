name: Prepare reviewed release draft
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag and release notes
        run: |
          node -e "const fs=require('fs'),assert=require('assert');assert.equal(process.env.GITHUB_REF_NAME,'v'+require('./package.json').version);assert(fs.existsSync('docs/releases/'+process.env.GITHUB_REF_NAME+'.md'))"
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B -m unittest discover -s companion/tests -v
      - run: npm run build
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: release-extensions
          path: dist/*.zip
  companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: companion/requirements.lock.txt
      - run: python -m pip install -r companion/requirements.lock.txt
      - run: python -B -m unittest discover -s companion/tests -v
      - run: ./scripts/build-companion.ps1
      - run: python scripts/package-dictionary-sources.py
      - run: ./scripts/test-companion-source.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-companion
          path: |
            .local/dictionary/dictionary-companion-windows-x64.zip
            .local/dictionary/dictionary-companion-sources.zip
  draft:
    needs: [extension, companion]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Refuse to replace a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > existing.json 2>/dev/null; then
            node -e "if(!require('./existing.json').isDraft)throw Error('Release is already published')"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
          files: release-assets/*.zip
      # Upload the separately verified dictionary snapshot and run the complete
      # asset audit before publishing this draft (docs/RELEASING.md).
