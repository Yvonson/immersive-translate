<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开放双语翻译</title><link rel="stylesheet" href="/ui/theme.css"><link rel="stylesheet" href="old-popup.css"><script src="detect-pdf.js"></script></head>
<body><main>
<header class="brand"><img src="/icons/icon-32.png" alt=""><div><strong>开放双语翻译</strong><small>Open Bilingual Translate</small></div><button id="openSettings" class="icon-button" aria-label="打开设置" title="设置">⚙</button></header>
<section class="card translation-card" aria-label="网页翻译">
<div class="language-pair"><div><span class="field-caption">原文语言</span><strong id="sourceLanguage">自动检测</strong></div><span class="language-arrow" aria-hidden="true">→</span><label><span class="field-caption">目标语言</span><select id="selectTargetLanguage" aria-label="目标语言"></select></label></div>
<label class="engine-row"><span>翻译服务</span><select id="selectService" aria-label="翻译服务"><option value="google">Google 翻译</option><option value="yandex">Yandex</option><option value="deepseek">DeepSeek</option><option value="local">本地模型</option><option value="custom">自定义接口</option></select></label>
<a id="configureService" class="help" href="/options/options.html#translations" hidden>配置此模型的 API 与密钥 →</a>
<div class="main-actions"><button id="btnTranslate" class="primary">翻译此页</button><button id="btnRestore" hidden>显示原文</button></div><p id="pageStatus" class="help" role="status" aria-live="polite">保留原文，在段落下方显示译文</p></section>
<section class="card quick-card" aria-label="阅读与字幕"><h2>阅读与字幕</h2><label class="switch-row"><span>显示双语对照</span><input id="dualLanguage" type="checkbox"></label><div id="readingControls"></div></section>
<details class="card site-card"><summary>网站与语言规则 <span id="currentSite" class="help"></span></summary><label class="switch-row"><span>自动翻译此网站</span><input id="alwaysSite" type="checkbox"></label><label class="switch-row"><span>从不翻译此网站</span><input id="neverSite" type="checkbox"></label><label id="autoLanguageRow" class="switch-row" hidden><span id="autoLanguageLabel">自动翻译此语言</span><input id="alwaysLanguage" type="checkbox"></label></details>
<footer><span>v__IMMERSIVE_TRANSLATE_VERSION__</span><a href="/options/options.html#hotkeys" target="_blank">快捷键</a><a href="/options/options.html" target="_blank">全部设置 →</a></footer>
</main><script src="/lib/languages.js"></script><script src="/lib/config.js"></script><script src="/ui/theme.js"></script><script src="old-popup.js"></script><script src="reading-controls.js"></script></body></html>
