<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
<meta content="IE=edge" http-equiv="X-UA-Compatible"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<link href="/ui/theme.css" rel="stylesheet"/>
<link href="document.css" rel="stylesheet"/></head>
<body>
<div class="title">开放双语翻译 · PDF</div>
<div class="alert" data-i18n="msgToTranslateThisDocument" data-i18n-ph-value="(.pdf)" id="conversionalert">To translate this document (.pdf) it is necessary to convert it to HTML.</div>
<div style="text-align: center;">
<div data-i18n="msgSelectServiceConversion" id="conversion" style="margin-bottom: 10px;">Select a service to do this conversion</div>
<div data-i18n="msgPleaseWait" id="pleasewait" style="margin: 10px;display: none;">Please wait...</div>
<div data-i18n="msgErrorDownloadingDocument" id="cannotDownload" style="margin: 13px;display: none;">Error downloading document</div>
<div id="selectService">
<div class="servicebutton" data-name="translatewebpages" id="translatewebpages">Translate Web Pages</div>
</div>
<div id="cannotusegoogle" style="margin: 13px;display: none;"></div>
<div class="sendbutton" data-i18n="msgOpenTranslated" id="send" style="display: none;">Open translated PDF</div>
</div>
<form action="https://translatewebpages.org/pdftohtml" enctype="multipart/form-data" id="form_translatewebpages" method="POST" style="display: none;" target="_blank">
<input hidden="" name="autotranslate" type="text"/>
<input name="file" type="file"/>
<input type="submit" value="Submit"/>
</form>
<script src="/lib/languages.js"></script>
<script src="/lib/config.js"></script>
<script src="/lib/i18n.js"></script>
<script src="/ui/theme.js"></script><script src="popup-translate-document.js"></script>
</body>
</html>
